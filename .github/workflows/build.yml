name: Construire RoxiPlayer APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Extraire le projet
        run: |
          unzip -q RoxiPlayer.zip -d source
          chmod +x source/RoxiPlayer/gradlew
      - name: Compiler l'APK
        working-directory: source/RoxiPlayer
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RoxiPlayer-1.3.2-apk
          path: source/RoxiPlayer/app/build/outputs/apk/debug/app-debug.apk
