name: Construire l'APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser le projet
        run: unzip -o RoxiPlayer.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Compiler
        working-directory: RoxiPlayer
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RoxiPlayer-apk
          path: RoxiPlayer/app/build/outputs/apk/debug/app-debug.apk
